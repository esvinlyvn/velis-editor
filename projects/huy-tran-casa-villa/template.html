<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Huy Trần · Casa Villa</title>
    <script src="assets/vendor/gsap.min.js"></script>
    {{BDS_JS}}
    <style>
{{FONTS}}
      /* Clip POV của Huy Trần (Casa Villa song lập, Blanca City), một cú máy liền. Giữ nguyên cảnh, thêm chữ chốt kiểu tạp chí
         (preset tap-chi + gia-chot / chu-bac / quay-vong / nhan-neon / go-chu theo nghĩa) + SFX. Không phụ đề. Xem SHOTBOOK.md.
         Font: Playfair Display 800 / 700 nghiêng (chữ chính, chữ khóa) + Plus Jakarta Sans 700 (chữ dẫn). Màu gradient champagne. */
      body { margin: 0; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; }
      #ft { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
      .bds { font-weight: 900; }
      /* ô chữ: căn giữa khung 1080, rộng tối đa 900; top theo từng khối. Không đặt class "slot" (trùng class nội bộ của quay-vong) */
      .kt-slot { position: absolute; left: 90px; right: 90px; display: flex; justify-content: center; }
      .kt-slot.narrow { left: 60px; right: 140px; } /* khối xuống dưới y 700: né cột nút bên phải (x > 940) */
      /* dải tối mờ sau khối chữ: tăng tương phản trên nền sáng; hiện/tắt cùng khối */
      /* lớp tối phía trên: gradient từ mép trên khung xuống, nhạt dần, hết ngay dưới chữ. Một lớp cố định cho cả video
         (không bám theo từng khối chữ). Chiều cao = đáy khối chữ thấp nhất + 140 px, template tự đo. */
      #scrim { position: absolute; left: 0; right: 0; top: 0; height: 900px; pointer-events: none;
        background: linear-gradient(180deg, rgba(0,0,0,.62) 0%, rgba(0,0,0,.5) 35%, rgba(0,0,0,.28) 65%, rgba(0,0,0,0) 100%); }
    </style>
    {{BDS_CSS}}
    <style>
      .bds-gia-chot .bg { display: none; } /* số mờ phía sau lệch với Playfair (dấu hỏi chữ "TỶ" lơ lửng) → ẩn */
      /* màu chữ ưu tiên gradient: nhãn neon và chữ gõ cũng tô gradient; quầng neon bằng drop-shadow (text-shadow lộ qua lòng chữ cắt nền) */
      .bds-nhan-neon .m.neon { background: linear-gradient(180deg, color-mix(in srgb, var(--c) 35%, #fff) 20%, var(--c) 60%, var(--c2) 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; padding: .24em .1em .08em;
        filter: drop-shadow(0 0 .1em var(--c)) drop-shadow(0 0 .35em color-mix(in srgb, var(--c) 60%, transparent)) drop-shadow(0 .03em .05em #000c); }
      .bds-go-chu .typer { background: linear-gradient(180deg, #fff 20%, color-mix(in srgb, var(--c) 45%, #fff) 60%, var(--c) 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent; padding: .2em .02em .06em; }
      .bds-go-chu .m { filter: drop-shadow(0 .03em .05em #000d) drop-shadow(0 0 .3em #0009); }
      .bds-chu-bac .m, .bds-chu-bac .k, .bds-quay-vong .k, .bds-gia-chot .k { filter: drop-shadow(0 .03em .05em #000d) drop-shadow(0 0 .25em #0009); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="huy" data-start="0" data-width="1080" data-height="1920" data-duration="{{DURATION}}">
      <video class="clip" id="ft" src="assets/footage.mp4" muted data-start="0" data-duration="{{DURATION}}" data-media-start="0" data-track-index="0"></video>
      <div class="clip" id="scrim" data-start="0" data-duration="{{DURATION}}" data-track-index="2"></div>
      <div class="clip" id="kt" data-start="0" data-duration="{{DURATION}}" data-track-index="3" style="position:absolute;inset:0"></div>

      {{SFX}}
      <audio id="voice" src="assets/voice.wav" data-start="0" data-duration="{{VOICE_DUR}}" data-track-index="9" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const KT = {{KT}};
      const FONT_D = '"Playfair Display", serif', FONT_S = '"Plus Jakarta Sans", sans-serif';
      // Chờ tải đủ font (kể cả bộ ký tự tiếng Việt) rồi mới dựng: đo bằng font dự phòng sẽ co chữ sai
      const VI = "ĐẤT TRỐNG ỞỮỰỆẢ ƯNG Ý đấtrốngởữựệả 0123456789²";
      Promise.all([document.fonts.load(`800 100px "Playfair Display"`, VI), document.fonts.load(`italic 700 100px "Playfair Display"`, VI), document.fonts.load(`700 40px "Plus Jakarta Sans"`, VI)]).then(() => document.fonts.ready).then(() => {
        const host = document.getElementById("kt");
        let scrimBottom = 0;
        KT.forEach((c, i) => {
          const slot = document.createElement("div");
          slot.className = "kt-slot" + (c.narrow ? " narrow" : ""); slot.id = "kt" + i; slot.style.top = (c.top ?? 400) + "px";
          host.appendChild(slot);
          // Khối rộng quá ô thì dựng lại với cỡ nhỏ hơn
          let o = { size: 170, display: FONT_D, sans: FONT_S, ...c.o }, h = BDS.make(c.p, slot, o);
          const Wd = slot.clientWidth * 0.96; // chừa 4% cho đoạn trôi phóng to khi đứng yên
          for (let n = 0; n < 3 && h.r.offsetWidth > Wd; n++) {
            const w = h.r.offsetWidth; h.r.remove();
            o = { ...o, size: Math.floor((o.size * Wd) / w) - 1 };
            h = BDS.make(c.p, slot, o);
          }
          // khối xuống dưới y 700 → ô hẹp x 60–940 (né cột nút bên phải), co lại nếu cần
          if (!slot.classList.contains("narrow") && h.r.getBoundingClientRect().bottom > 700) {
            slot.classList.add("narrow");
            const Wn = slot.clientWidth * 0.96;
            for (let n = 0; n < 3 && h.r.offsetWidth > Wn; n++) {
              const w = h.r.offsetWidth; h.r.remove();
              o = { ...o, size: Math.floor((o.size * Wn) / w) - 1 };
              h = BDS.make(c.p, slot, o);
            }
          }
          // dải tối theo chiều cao khối
          scrimBottom = Math.max(scrimBottom, h.r.getBoundingClientRect().bottom);
          BDS.in(tl, h, c.at);
          if (c.out < 900) { // out 999 = giữ tới hết video
            // thoát: tap-chi cho từng từ rơi xuống; preset khác mờ + tan
            if (h.p.leave) h.p.leave(tl, h.parts, c.out - 0.05, parseFloat(getComputedStyle(h.r).fontSize));
            BDS.out(tl, h, c.out, 0.3);
          }
          (window.__kt = window.__kt || []).push({ ...c, h });
        });
        document.getElementById("scrim").style.height = Math.round(scrimBottom + 140) + "px";
        // đăng ký timeline SAU khi dựng xong (lint: gsap_timeline_registered_before_async_build)
        window.__timelines["huy"] = tl;
        window.__hfForceTimelineRebind?.();
      });
    </script>
  </body>
</html>
