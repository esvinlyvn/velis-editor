<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Tú · Casa Villa</title>
    <script src="assets/vendor/gsap.min.js"></script>
    {{BDS_JS}}
    <style>
{{FONTS}}
      /* Clip tự quay của Tú. Giữ cảnh quay, thêm chữ chốt preset BĐS ở dải trời phía trên đầu (y 270–580; đầu Tú luôn dưới y ~620)
         và SFX nhẹ. Không phụ đề. Font: Big Shoulders Display 900 (chữ chính, condensed) + Unbounded 700 (chữ dẫn). Màu theo nghĩa: vàng = con số/sản phẩm, xanh dương = nơi chốn,
         đỏ = điều không còn/không có, xanh lá = điểm an toàn. Vùng an toàn TikTok: x 60–940, y 250–1440. */
            body { margin: 0; background: #000; font-family: var(--sans); }
      .bds { font-weight: 900; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; }
      #cam { position: absolute; inset: 0; transform-origin: 50% 40%; }
      #ft { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
      /* lớp tối phía trên để chữ trắng đọc được trên trời và tường trắng */
      .scrim { position: absolute; left: 0; right: 0; top: 0; height: 760px; background: linear-gradient(180deg, rgba(0,0,0,.6) 0%, rgba(0,0,0,.4) 45%, rgba(0,0,0,0) 100%); pointer-events: none; }
      .kt-slot { position: absolute; left: 70px; right: 70px; top: 250px; display: flex; justify-content: center; } /* dải trời: căn giữa khung 1080, rộng tối đa 940 */
      .kt-slot.low { left: 140px; right: 140px; top: 1250px; } /* dải áo vest: tránh cột nút bên phải (x > 940 từ y 700) */
    </style>
    {{BDS_CSS}}
    <style>
      /* số mờ phía sau của gia-chot: mặc định 1.5em tràn khung 1080 với số dài ("HƠN 300 m²") → thu về 1.12em */
      .bds-gia-chot .bg { font-size: 1.12em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="tu" data-start="0" data-width="1080" data-height="1920" data-duration="{{DURATION}}">
      <div id="cam"><video class="clip" id="ft" src="assets/footage.mp4" muted data-start="0" data-duration="{{DURATION}}" data-media-start="0" data-track-index="0"></video></div>
      <div class="clip scrim" id="scrim" data-start="0" data-duration="{{DURATION}}" data-track-index="1"></div>
      <div class="clip" id="kt" data-start="0" data-duration="{{DURATION}}" data-track-index="3" style="position:absolute;inset:0"></div>

      {{SFX}}
      <audio id="voice" src="assets/voice.wav" data-start="0" data-duration="{{VOICE_DUR}}" data-track-index="9" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["tu"] = tl;
      // Vết cắt câu nói vấp: đẩy máy vào 6% đúng khung cắt, giữ tới hết
      tl.fromTo("#cam", { scale: 1 }, { scale: 1.06, duration: 0.01, ease: "none" }, {{CUT}});

      // Chữ chốt: mỗi khối một ô riêng ở dải trời; dựng sau khi font nạp (preset đo ký tự để ôm sát dòng)
      const KT = {{KT}};
      const FONT_D = '"Big Shoulders Display", sans-serif', FONT_S = '"Unbounded", sans-serif';
      // Chờ tải đủ font (kể cả bộ ký tự tiếng Việt, tải theo unicode-range) trước khi dựng: đo bằng font dự phòng sẽ co chữ sai
      const VI = "ĐẤT TRỐNG ỞỮỰỆẢ đấtrốngởữựệả 0123456789";
      Promise.all(["900 100px", "800 100px"].map((w) => document.fonts.load(`${w} "Big Shoulders Display"`, VI))
        .concat(["700 40px", "600 40px"].map((w) => document.fonts.load(`${w} "Unbounded"`, VI)))).then(() => document.fonts.ready).then(() => {
        KT.forEach((c, i) => {
          const slot = document.createElement("div");
          slot.className = "kt-slot"; slot.id = "kt" + i; // không đặt class "slot": trùng class nội bộ của quay-vong
          if (c.zone === "low") slot.classList.add("low");
          document.getElementById("kt").appendChild(slot);
          // Khối rộng quá khung thì dựng lại với cỡ nhỏ hơn (preset đo lại khoảng cách dòng theo cỡ mới)
          // font truyền qua tham số: .bds tự khai báo --display/--sans nên biến ở :root không tới được
          let o = { size: 140, display: FONT_D, sans: FONT_S, ...c.o }, h = BDS.make(c.p, slot, o);
          const W = slot.clientWidth;
          for (let n = 0; n < 3 && h.r.offsetWidth > W; n++) {
            const w = h.r.offsetWidth;
            h.r.remove();
            o = { ...o, size: Math.floor((o.size * W) / w) - 1 };
            h = BDS.make(c.p, slot, o);
          }
          BDS.in(tl, h, c.at);
          if (c.out < 90) BDS.out(tl, h, c.out, 0.2);
          (window.__kt = window.__kt || []).push({ ...c, h });
        });
      });
    </script>
  </body>
</html>
