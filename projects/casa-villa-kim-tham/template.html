<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Kim Thắm · Casa Villa</title>
    <script src="assets/vendor/gsap.min.js"></script>
    {{BDS_JS}}
    <style>
{{FONTS}}
      /* Clip Kim Thắm dẫn Casa Villa (Blanca City), giữ nguyên cảnh, thêm chữ chốt (preset chính tang-truong + gia-chot / chu-bac /
         quay-vong / nhan-neon / canh-bao / song / go-chu theo nghĩa) + SFX. Không phụ đề. Xem SHOTBOOK.md.
         Font: Yeseva One (chữ chính) + Encode Sans 700 (chữ dẫn). Màu gradient theo nghĩa. */
      body { margin: 0; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; }
      #ft { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
      .bds { font-weight: 900; }
      /* ô chữ: căn giữa khung 1080, rộng tối đa 900; top theo từng khối. Không đặt class "slot" (trùng class nội bộ của quay-vong) */
      .kt-slot { position: absolute; left: 90px; right: 90px; display: flex; justify-content: center; }
      .kt-slot.narrow { left: 60px; right: 140px; } /* khối xuống dưới y 700: né cột nút bên phải (x > 940) */
      /* Lớp phủ tối sau chữ (TALKING-HEAD luật 13, 15): CHỈ hiện khi có chữ, mờ vào/ra theo đoạn; các khối liền nhau
         (nghỉ < 1 s) dùng chung một lần phủ, không nháy theo từng khối. Độ đậm theo nền đo được (scripts/text-contrast.mjs):
         nền sáng phủ đậm, nền tối phủ nhẹ. Hai lớp: dải trên (gradient từ mép trên, nhạt dần mượt tới 380 px dưới khối thấp nhất)
         và dải dưới (dải ngang quanh các khối top ≥ 900, lúc nửa trên có chữ in sẵn của clip gốc). */
      .scrim { position: absolute; left: 0; right: 0; pointer-events: none; opacity: 0; }
      /* gradient dựng bằng JS theo đường cong mượt (smootherstep), 25 điểm màu: không có điểm gãy → không thấy vệt cắt.
         Dải trên: đậm nhất ở đỉnh video, nhạt dần liên tục ngay từ mép trên xuống, hết 160 px dưới chữ. Dải dưới (khối top ≥ 900): hai đầu mượt. */
      #scrim { top: 0; height: 900px; } #scrim-low { top: 700px; height: 800px; }
    </style>
    {{BDS_CSS}}
    <style>
      /* MỘT lớp làm tối duy nhất (TALKING-HEAD luật 18): lớp phủ gradient lo tương phản; chữ KHÔNG mang quầng tối riêng
         (drop-shadow/text-shadow tối loang rộng chồng lên lớp phủ thành 2 lớp tối). Chữ chỉ giữ viền tối mảnh 1 px để tách nét,
         đặt trên ô .kt-slot (BDS.in tween filter blur trên khối/dòng nên không đặt ở đó). Quầng MÀU (neon, sóng, số) giữ nguyên. */
      .kt-slot { filter: drop-shadow(0 0 1px rgba(0,0,0,.85)) drop-shadow(0 1px 1px rgba(0,0,0,.45)); }
      .kt-slot.hard { filter: drop-shadow(0 0 1.5px rgba(0,0,0,.95)) drop-shadow(0 0 1px rgba(0,0,0,.9)) drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
      /* gỡ quầng tối có sẵn trong CSS preset BĐS */
      .bds-noi-bat .m .ch { text-shadow: 0 0 .3em color-mix(in srgb, var(--c) 60%, transparent); }
      .bds-chuyen-dong .l1 .ch, .bds-toc-do .m .ch { text-shadow: none; }
      .bds-quay-vong .slot, .bds-khoi-noi .m { filter: none; }
      .bds-gia-chot .m { filter: drop-shadow(0 0 .3em color-mix(in srgb, var(--c) 35%, transparent)); }
      .bds-khoi-noi .k.pill { box-shadow: none; }
      .bds-gia-chot .bg { display: none; } /* số mờ phía sau lệch với font serif → ẩn (TALKING-HEAD mục 5) */
      /* đáy chỉ nhạt bớt (mặt nạ gốc mờ hẳn về 0 làm mất dấu nặng: "THỰ" đọc thành "THU") */
      .bds-tang-truong .m { line-height: 1.05; -webkit-mask-image: linear-gradient(180deg, #000 72%, #000c 100%); mask-image: linear-gradient(180deg, #000 72%, #000c 100%); }
      .bds-ky-thuat .m.grad .ch { padding: .22em .14em .08em; margin: -.22em -.14em -.08em; } /* chữ nghiêng tô gradient: đệm 2 bên rộng, không xén mép (luật 12) */
      /* màu chữ ưu tiên gradient: nhãn neon và chữ gõ cũng tô gradient; quầng neon cùng màu bằng drop-shadow (text-shadow lộ qua lòng chữ cắt nền) */
      .bds-nhan-neon .m.neon { background: linear-gradient(180deg, color-mix(in srgb, var(--c) 35%, #fff) 20%, var(--c) 60%, var(--c2) 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; padding: .24em .1em .08em;
        filter: drop-shadow(0 0 .1em var(--c)) drop-shadow(0 0 .35em color-mix(in srgb, var(--c) 60%, transparent)); }
      .bds-go-chu .typer { background: linear-gradient(180deg, #fff 20%, color-mix(in srgb, var(--c) 45%, #fff) 60%, var(--c) 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent; padding: .2em .02em .06em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="kim" data-start="0" data-width="1080" data-height="1920" data-duration="{{DURATION}}">
      <video class="clip" id="ft" src="assets/footage.mp4" muted data-start="0" data-duration="{{DURATION}}" data-media-start="0" data-track-index="0"></video>
      <div class="clip scrim" id="scrim" data-start="0" data-duration="{{DURATION}}" data-track-index="2"></div>
      <div class="clip scrim" id="scrim-low" data-start="0" data-duration="{{DURATION}}" data-track-index="2"></div>
      <div class="clip" id="kt" data-start="0" data-duration="{{DURATION}}" data-track-index="3" style="position:absolute;inset:0"></div>

      {{SFX}}
      <audio id="voice" src="assets/voice.wav" data-start="0" data-duration="{{VOICE_DUR}}" data-track-index="9" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const KT = {{KT}};
      const FONT_D = '"Yeseva One", serif', FONT_S = '"Encode Sans", sans-serif';
      // Chờ tải đủ font (kể cả bộ ký tự tiếng Việt) rồi mới dựng: đo bằng font dự phòng sẽ co chữ sai
      const VI = "ĐẤT TRỐNG ỞỮỰỆẢ ƯNG Ý đấtrốngởữựệả 0123456789²";
      Promise.all([document.fonts.load(`400 100px "Yeseva One"`, VI), document.fonts.load(`700 40px "Encode Sans"`, VI), document.fonts.load(`600 40px "Encode Sans"`, VI)]).then(() => document.fonts.ready).then(() => {
        const host = document.getElementById("kt");
        let topTop = 1e9, scrimBottom = 0, lowTop = 1e9, lowBottom = 0;
        KT.forEach((c, i) => {
          const slot = document.createElement("div");
          const low = (c.top ?? 400) >= 900;
          slot.className = "kt-slot" + (c.narrow || low ? " narrow" : "") + (low ? " low" : "") + (c.hard ? " hard" : ""); slot.id = "kt" + i; slot.style.top = (c.top ?? 400) + "px";
          host.appendChild(slot);
          // Khối rộng quá ô thì dựng lại với cỡ nhỏ hơn
          let o = { size: 170, display: FONT_D, sans: FONT_S, ...c.o }, h = BDS.make(c.p, slot, o);
          const Wd = slot.clientWidth * 0.96; // chừa 4% cho đoạn trôi phóng to khi đứng yên
          for (let n = 0; n < 3 && h.r.offsetWidth > Wd; n++) {
            const w = h.r.offsetWidth; h.r.remove();
            o = { ...o, size: Math.floor((o.size * Wd) / w) - 1 };
            h = BDS.make(c.p, slot, o);
          }
          // khối xuống dưới y 700 → ô hẹp x 60–940 (né cột nút bên phải), co lại nếu cần
          if (!slot.classList.contains("narrow") && h.r.getBoundingClientRect().bottom > 700) {
            slot.classList.add("narrow");
            const Wn = slot.clientWidth * 0.96;
            for (let n = 0; n < 3 && h.r.offsetWidth > Wn; n++) {
              const w = h.r.offsetWidth; h.r.remove();
              o = { ...o, size: Math.floor((o.size * Wn) / w) - 1 };
              h = BDS.make(c.p, slot, o);
            }
          }
          const rb = h.r.getBoundingClientRect();
          c.zone = low ? "low" : "top"; c.cy = (rb.top + rb.bottom) / 2;
          if (low) { lowTop = Math.min(lowTop, rb.top); lowBottom = Math.max(lowBottom, rb.bottom); }
          else { topTop = Math.min(topTop, rb.top); scrimBottom = Math.max(scrimBottom, rb.bottom); }
          BDS.in(tl, h, c.at);
          if (c.out < 900) { // out 999 = giữ tới hết video
            // thoát: tap-chi cho từng từ rơi xuống; preset khác mờ + tan
            if (h.p.leave) h.p.leave(tl, h.parts, c.out - 0.05, parseFloat(getComputedStyle(h.r).fontSize));
            BDS.out(tl, h, c.out, 0.3);
          }
          (window.__kt = window.__kt || []).push({ ...c, h });
        });
        // ---------- lớp phủ: kích thước theo khối, độ đậm theo nền, chỉ hiện khi có chữ ----------
        const sc = { top: document.getElementById("scrim"), low: document.getElementById("scrim-low") };
        // dải trên: từ ĐỈNH video (y 0), nhạt dần ngay từ mép trên, liên tục xuống, hết 160 px dưới khối chữ thấp nhất
        const geo = { top: [0, Math.round(scrimBottom + 160)], low: [Math.round(lowTop - 260), Math.round(lowBottom - lowTop + 520)] };
        // độ phủ theo vị trí (f = 0 mép trên lớp, 1 mép dưới): smootherstep → đạo hàm bằng 0 ở hai đầu, chuyển mềm
        const sm = (t) => { t = Math.min(1, Math.max(0, t)); return t * t * t * (t * (t * 6 - 15) + 10); };
        const band = (f, a, b) => (f < a ? sm(f / a) : f > b ? 1 - sm((f - b) / (1 - b)) : 1); // lên mượt · phẳng · xuống mượt
        // (1 − f)^1,6: đậm nhất ở đỉnh, nhạt dần ngay từ mép trên, về 0 êm ở đáy (không vệt cắt)
        const PROF = { top: (f) => 0.9 * Math.pow(1 - Math.min(1, Math.max(0, f)), 1.6), low: (f) => 0.7 * band(f, 0.35, 0.65) };
        for (const z of ["top", "low"]) {
          sc[z].style.top = geo[z][0] + "px"; sc[z].style.height = geo[z][1] + "px";
          sc[z].style.background = `linear-gradient(180deg, ${Array.from({ length: 25 }, (_, i) => `rgba(0,0,0,${PROF[z](i / 24).toFixed(3)}) ${((i / 24) * 100).toFixed(1)}%`).join(", ")})`;
        }
        const alphaAt = (zone, y) => PROF[zone]((y - geo[zone][0]) / geo[zone][1]);
        const MIN = 0.2; // có chữ thì luôn có một lớp phủ nhẹ
        for (const zone of ["top", "low"]) {
          const ks = KT.filter((c) => c.zone === zone);
          let cur = 0;
          ks.forEach((c, j) => {
            const target = Math.min(1, Math.max(MIN, (c.scrim ?? 0) / Math.max(0.2, alphaAt(zone, c.cy))));
            const prev = ks[j - 1], next = ks[j + 1];
            const join = prev && c.at - prev.out < 1.0; // nối liền khối trước: chỉ chuyển độ đậm, không tắt
            tl.fromTo(sc[zone], { opacity: cur }, { opacity: target, duration: join ? 0.45 : 0.55, ease: "sine.inOut", immediateRender: false }, Math.max(0, c.at - (join ? 0.15 : 0.45)));
            cur = target;
            if (c.out < 900 && !(next && next.at - c.out < 1.0)) { // hết đoạn có chữ → mờ ra
              tl.fromTo(sc[zone], { opacity: cur }, { opacity: 0, duration: 0.6, ease: "sine.inOut", immediateRender: false }, c.out);
              cur = 0;
            }
          });
        }
        // đăng ký timeline SAU khi dựng xong (lint: gsap_timeline_registered_before_async_build)
        window.__timelines["kim"] = tl;
        window.__hfForceTimelineRebind?.();
      });
    </script>
  </body>
</html>
